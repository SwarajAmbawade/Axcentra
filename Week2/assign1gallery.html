<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Image Gallery</title>

  <!-- CSS File -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Interactive Image Gallery</h1>

  <div class="gallery">
    <img src="https://picsum.photos/id/1015/600/400" alt="Image 1">
    <img src="https://picsum.photos/id/1025/600/400" alt="Image 2">
    <img src="https://picsum.photos/id/1035/600/400" alt="Image 3">
    <img src="https://picsum.photos/id/1045/600/400" alt="Image 4">
    <img src="https://picsum.photos/id/1055/600/400" alt="Image 5">
    <img src="https://picsum.photos/id/1065/600/400" alt="Image 6">
  
    <img src="https://picsum.photos/id/1015/600/400" alt="Image 7">
    <img src="https://picsum.photos/id/1025/600/400" alt="Image 8">
    <img src="https://picsum.photos/id/1035/600/400" alt="Image 9">
    <img src="https://picsum.photos/id/1045/600/400" alt="Image 10">
  
    <!-- New Images -->
    <img src="https://picsum.photos/id/110/600/400" alt="Image 11">
    <img src="https://picsum.photos/id/121/600/400" alt="Image 12">
    <img src="https://picsum.photos/id/132/600/400" alt="Image 13">
</div>


  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="close" id="closeBtn">&times;</span>
    <img id="lightboxImg">
  </div>

  <!-- JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
